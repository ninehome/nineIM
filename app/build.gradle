apply plugin: 'com.android.application'
apply plugin: 'com.huawei.agconnect'

//引入Kotlin的插件
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'

android {
//    buildTypes {
//        debug {
//            // 确保debug模式启用日志
//            debuggable true
//            buildConfigField "boolean", "LOG_DEBUG", "true"
//        }
//    }

    compileSdkVersion 30
    defaultConfig {
        applicationId "cn.wangliantong.app"
//        applicationId "com.dfadsgdsfdfasdfds.fdfsf.chaat"
        minSdkVersion 21
        targetSdkVersion 30
        versionCode 111
        versionName "5.0.9"

        multiDexEnabled true

        ndkVersion "16.1.4479499" // 和你本地 SDK Manager 安装的版本一致

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }

        manifestPlaceholders = [OUT_APK_TIME: getOutApkTime()]
    }
    sourceSets {
        main {
            assets.srcDirs = ['assets']
        }
    }
    signingConfigs{
        debug{
            keyAlias 'im'
            keyPassword '123456'
            storeFile file('sig-adaptation/debug/apk_key')
            storePassword '123456'
            v1SigningEnabled true
            v2SigningEnabled true
        }

        release {
            keyAlias 'im'
            keyPassword '123456'
            storeFile file('sig-adaptation/debug/apk_key')
            storePassword '123456'
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }
    buildTypes {
//        release {
//            minifyEnabled true
//            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
//            proguardFiles getDefaultProguardFile('proguard-android.txt')
//        }
//        debug {
//        }
        release {
//            debuggable false
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            zipAlignEnabled false
            multiDexEnabled true
            signingConfig signingConfigs.release
        }

        debug{
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            zipAlignEnabled false
            multiDexEnabled true
            signingConfig signingConfigs.release
        }

    }
    android.applicationVariants.all { variant ->
        variant.outputs.all {
            def appName = "亿讯企业版"
            outputFileName = "${appName}-${variant.baseName}-V${variant.versionName}.apk"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    dataBinding {
        enabled true
    }
    buildToolsVersion = '28.0.3'
    //buildToolsVersion '34.0.0'
}

def static getOutApkTime() {
    return new Date().format("yyyy-MM-dd HH:mm:ss", TimeZone.getTimeZone("GMT+08"))
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'com.google.android.material:material:1.2.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.shuyu:gsyVideoPlayer-java:7.1.4'
    implementation 'com.shuyu:GSYVideoPlayer-exo2:7.1.4'
    implementation 'com.shuyu:gsyVideoPlayer-armv5:7.1.4'
    implementation 'com.shuyu:gsyVideoPlayer-armv7a:7.1.4'
    implementation 'com.shuyu:gsyVideoPlayer-arm64:7.1.4'
    implementation 'com.shuyu:gsyVideoPlayer-x64:7.1.4'
    implementation 'com.shuyu:gsyVideoPlayer-x86:7.1.4'

    implementation 'com.github.ceryle:FitGridView:v1.0.5'

    implementation project(path: ':lib-imclient')
    implementation project(path: ':lib-httpclient')
    implementation project(path: ':lib-webrtclib')
    implementation project(path: ':lib-audiorecord')
    implementation project(path: ':lib-androidutils')
    implementation project(path: ':lib-db')
    implementation project(path: ':lib-appupdate')
    implementation project(path: ':jpush')
    implementation project(path: ':lib-wallet')
    implementation project(path: ':lib-qrcode')
    implementation project(path: ':tio-social')
    implementation project(path: ':tio-verification')
    implementation project(path: ':tio-account')
    implementation project(path: ':pullToRefershLibraryMy')
    implementation files('lib/nineoldandroids.jar')
    implementation project(path: ':easyPhotos')
    // implementation 'com.github.HuanTanSheng:EasyPhotos:3.1.5'
    implementation "com.alibaba:fastjson:1.2.59"
    implementation files('lib\\BaiduLBS_Android.jar')

    implementation 'cn.bingoogolapple:bga-qrcode-zxing:1.3.7'
//    implementation files('lib/fastjson-1.2.40.jar')
    //保活
//    implementation 'com.github.wangshihu123:DaemonLibrary:v1.2.1'
    implementation 'com.shuyu:gsyVideoPlayer-java:7.1.6'
    implementation 'com.scwang.smartrefresh:SmartRefreshLayout:1.1.2'
    implementation "com.android.support:support-compat:27.1.1"
    // implementation "androidx.core:core:1.9.0"
    implementation"org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.4.10"
}
