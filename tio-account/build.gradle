plugins {
    id 'com.android.library'
}

android {
    compileSdkVersion 30
    buildToolsVersion "30.0.1"

    defaultConfig {
        minSdkVersion 19
        targetSdkVersion 30
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    dataBinding {
        enabled true
    }
}

repositories {
//    flatDir{
//        dirs project(':tio-account').file('libs')
//    }
}

dependencies {
//    implementation files('libs\\umeng-common-9.3.7.jar')
//
//    implementation (name:'umeng-uverify-2.4.1', ext:'aar')
    implementation fileTree(dir: 'libs', include: ['*.aar','*.jar'])

    testImplementation 'junit:junit:4.13.1'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'

    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'com.google.android.material:material:1.2.1'

    implementation project(path: ':lib-androidutils')
    implementation project(path: ':lib-httpclient')
    implementation project(path: ':lib-imclient')
    implementation project(path: ':lib-db')
    implementation project(path: ':tio-verification')
    implementation project(path: ':jpush')
    implementation project(path: ':tio-social')
}