apply plugin: 'com.android.library'

android {
    compileSdkVersion 30
    buildToolsVersion "30.0.1"

    defaultConfig {
        minSdkVersion 19
        targetSdkVersion 30
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['assets']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    dataBinding {
        enabled true
    }

    android.libraryVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "${project.name}-${defaultConfig.versionName}-${buildType.name}.aar"
        }
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])

    testImplementation 'junit:junit:4.13.1'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'

    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'com.google.android.material:material:1.2.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-savedstate:2.2.0'

    api 'com.jaeger.statusbarutil:library:1.5.1'

    implementation 'org.apache.commons:commons-lang3:3.11'
    api 'com.blankj:utilcodex:1.30.5'
    api 'com.facebook.fresco:fresco:2.3.0'
    api 'com.facebook.fresco:animated-gif:2.3.0'
    api 'com.facebook.fresco:soloader:2.3.0'
//    api 'com.github.CymChad:BaseRecyclerViewAdapterHelper:2.9.45-androidx'
    api 'com.watayouxiang:Permission:2.0.1'
    api 'com.watayouxiang:DemoShell:1.0.8'
    api 'com.watayouxiang:widgetlibrary:0.0.4'
//    api 'com.github.HuanTanSheng:EasyPhotos:3.0.6'
    api 'com.github.yalantis:ucrop:2.2.2'
//    api 'com.github.HuanTanSheng:EasyPhotos:3.1.3'
//    implementation 'com.joker.HuanTanSheng:EasyPhotos:_latestVersion'
    implementation 'com.github.bumptech.glide:glide:4.11.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.11.0'
    implementation 'com.github.maning0303:MNImageBrowser:V1.2.5X'
    api 'com.qmuiteam:qmui:2.0.0-alpha10'

    implementation project(path: ':lib-httpclient')
    implementation project(path: ':lib-imclient')
    implementation project(path: ':easyPhotos')
    api project(path: ':lib-baseRecyclerView')
}